name: Nova
description: 'Nova (Nova Intelligence) is an agentic AI platform for SAP teams, used in production across
  documentation, functional design, development, and production issue resolution. Its capabilities include
  code intelligence and system visibility, fit-to-standard analysis mapping custom code to SAP standard,
  development acceleration for ABAP Cloud and BTP CAP, S/4HANA and Clean Core transformation support, and
  security vulnerability identification, with claims of a 3x productivity boost at 50% lower cost. Nova is
  an enterprise, demo-led product with no public API, developer portal, or SDKs at this time; it is backed
  by Accel and Battery Ventures. This profile was enriched by the API Evangelist pipeline, which probed the
  company''s public surface and found a domain-security posture and a Vanta trust center but no developer or
  API artifacts to harvest.'
